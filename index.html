<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo — Shared Kanban</title>
  <style>
    :root {
      --bg: #07080d;
      --surface: rgba(17, 19, 28, 0.72);
      --surface-strong: rgba(22, 25, 38, 0.88);
      --card: rgba(25, 29, 44, 0.78);
      --card-hover: rgba(34, 39, 58, 0.92);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #f3f5fa;
      --muted: #8b94ab;
      --dim: #5c657d;
      --accent: #8b5cf6;
      --accent-2: #22d3ee;
      --ok: #10b981;
      --warn: #f59e0b;
      --danger: #f43f5e;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      --card-shadow: 0 6px 20px rgba(0, 0, 0, 0.28);
      --input-bg: rgba(9, 11, 18, 0.78);
      --aura-opacity: 0.55;
    }

    html[data-theme="light"] {
      --bg: #f3f5fb;
      --surface: rgba(255, 255, 255, 0.76);
      --surface-strong: rgba(255, 255, 255, 0.94);
      --card: rgba(255, 255, 255, 0.92);
      --card-hover: #ffffff;
      --border: rgba(15, 23, 42, 0.09);
      --border-strong: rgba(15, 23, 42, 0.18);
      --text: #0f172a;
      --muted: #52607a;
      --dim: #8a96ad;
      --accent: #6d28d9;
      --accent-2: #0891b2;
      --ok: #059669;
      --warn: #d97706;
      --danger: #e11d48;
      --shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
      --card-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      --input-bg: rgba(241, 245, 249, 0.9);
      --aura-opacity: 0.25;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient aurora background */
    .aura {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      opacity: var(--aura-opacity);
    }

    .aura::before,
    .aura::after,
    .aura-orb {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(110px);
      will-change: transform;
    }

    .aura::before {
      width: 560px;
      height: 560px;
      top: -180px;
      left: -120px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.55), transparent 70%);
      animation: drift 18s ease-in-out infinite alternate;
    }

    .aura::after {
      width: 520px;
      height: 520px;
      top: -120px;
      right: -140px;
      background: radial-gradient(circle, rgba(34, 211, 238, 0.42), transparent 70%);
      animation: drift 22s ease-in-out infinite alternate-reverse;
    }

    .aura-orb {
      width: 480px;
      height: 480px;
      bottom: -200px;
      left: 35%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.34), transparent 70%);
      animation: drift 26s ease-in-out infinite alternate;
    }

    @keyframes drift {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(40px, 28px, 0) scale(1.08); }
    }

    /* Subtle dot grid */
    .grid-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: radial-gradient(var(--border) 1px, transparent 1px);
      background-size: 26px 26px;
      mask-image: radial-gradient(ellipse at top, rgba(0, 0, 0, 0.7), transparent 78%);
    }

    .shell {
      position: relative;
      z-index: 1;
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 20px 56px;
    }

    /* Top header */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #8b5cf6 0%, #22d3ee 100%);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1rem;
      color: #fff;
      box-shadow: 0 0 24px rgba(139, 92, 246, 0.45);
      letter-spacing: -0.04em;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 750;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, var(--text), var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      font-size: 0.78rem;
      color: var(--muted);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dim);
      position: relative;
    }

    .live-pill.online .pulse-dot {
      background: var(--ok);
      box-shadow: 0 0 10px var(--ok);
    }

    .live-pill.online .pulse-dot::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1.5px solid var(--ok);
      opacity: 0.6;
      animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    .live-pill.error .pulse-dot {
      background: var(--danger);
      box-shadow: 0 0 10px var(--danger);
    }

    @keyframes ping {
      75%, 100% { transform: scale(2); opacity: 0; }
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .segmented {
      display: inline-flex;
      padding: 3px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 6px 13px;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .seg-btn.active {
      background: var(--card-hover);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
    }

    .ghost-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.12s ease;
    }

    .ghost-btn:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    /* Progress rail */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .progress-track {
      flex: 1;
      height: 5px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #8b5cf6, #22d3ee, #10b981);
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.55);
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Error banner */
    .error-banner {
      display: none;
      margin-bottom: 14px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: var(--danger);
      font-size: 0.84rem;
    }

    .error-banner.visible {
      display: block;
    }

    /* Composer bar */
    .composer {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px;
      margin-bottom: 24px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .composer:focus-within {
      border-color: rgba(139, 92, 246, 0.55);
      box-shadow: 0 0 0 1px rgba(139, 92, 246, 0.3), var(--shadow);
    }

    .composer input[type="text"] {
      flex: 1 1 260px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 0.94rem;
      outline: none;
    }

    .composer input[type="text"]::placeholder {
      color: var(--dim);
    }

    .composer select {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.84rem;
      font-weight: 500;
      outline: none;
      cursor: pointer;
    }

    .add-btn {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 0.88rem;
      font-weight: 650;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 55%, #06b6d4 100%);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.35);
      transition: transform 0.14s ease, box-shadow 0.14s ease, opacity 0.14s ease;
    }

    .add-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 26px rgba(139, 92, 246, 0.5);
    }

    .add-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    /* Kanban Board */
    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .board {
        grid-template-columns: 1fr;
      }
    }

    .column {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 360px;
      border-radius: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    }

    .column::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--col-accent);
      opacity: 0.85;
    }

    .column[data-status="todo"] { --col-accent: linear-gradient(90deg, #8b5cf6, #a78bfa); --col-glow: rgba(139, 92, 246, 0.35); }
    .column[data-status="in_progress"] { --col-accent: linear-gradient(90deg, #06b6d4, #f59e0b); --col-glow: rgba(34, 211, 238, 0.35); }
    .column[data-status="done"] { --col-accent: linear-gradient(90deg, #10b981, #34d399); --col-glow: rgba(16, 185, 129, 0.35); }

    .column.drag-over {
      border-color: var(--border-strong);
      box-shadow: 0 0 0 1px var(--col-glow), 0 18px 46px var(--col-glow);
      transform: translateY(-2px);
    }

    .col-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    .col-title-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .col-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--col-accent);
      box-shadow: 0 0 10px var(--col-glow);
    }

    .col-title {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .col-count {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--muted);
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--input-bg);
      border: 1px solid var(--border);
    }

    .col-action {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .col-action:hover {
      color: var(--danger);
      background: rgba(244, 63, 94, 0.1);
    }

    .col-cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      flex: 1;
    }

    .card {
      position: relative;
      padding: 13px 14px;
      border-radius: 13px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--card-shadow);
      cursor: grab;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .card.dragging {
      opacity: 0.42;
      cursor: grabbing;
      transform: scale(0.98);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .prio-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.69rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid transparent;
    }

    .prio-high {
      color: #fb7185;
      background: rgba(244, 63, 94, 0.12);
      border-color: rgba(244, 63, 94, 0.25);
    }

    .prio-medium {
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.24);
    }

    .prio-low {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.24);
    }

    .card-text {
      font-size: 0.92rem;
      color: var(--text);
      word-break: break-word;
      margin-bottom: 10px;
    }

    .column[data-status="done"] .card-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .card-edit-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 6px 8px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 10px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      color: var(--dim);
    }

    .card-actions {
      display: inline-flex;
      gap: 4px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      border-radius: 7px;
      padding: 3px 7px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.13s ease;
    }

    .icon-btn:hover {
      background: var(--input-bg);
      border-color: var(--border);
      color: var(--text);
    }

    .icon-btn.del:hover {
      color: var(--danger);
      background: rgba(244, 63, 94, 0.12);
      border-color: rgba(244, 63, 94, 0.25);
    }

    .empty-col {
      margin: auto 0;
      padding: 28px 14px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--dim);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    /* List View */
    .list-shell {
      display: none;
      border-radius: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .list-shell.active {
      display: block;
    }

    .board.hidden {
      display: none;
    }

    .list-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--muted);
    }

    .filter-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 4px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .filter-btn.active {
      color: var(--text);
      background: var(--input-bg);
      border-color: var(--border);
    }

    .list-items {
      list-style: none;
    }

    .list-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      transition: background 0.13s ease;
    }

    .list-row:last-child {
      border-bottom: none;
    }

    .list-row:hover {
      background: var(--card);
    }

    .list-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .list-row-text {
      flex: 1;
      font-size: 0.94rem;
      word-break: break-word;
    }

    .list-row.done .list-row-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .status-chip {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--muted);
      cursor: pointer;
    }

    /* MCP Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(8px);
      display: none;
      place-items: center;
      padding: 20px;
    }

    .modal-backdrop.open {
      display: grid;
    }

    .modal {
      width: 100%;
      max-width: 520px;
      border-radius: 18px;
      background: var(--surface-strong);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal h2 {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .modal p {
      font-size: 0.84rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .code-box {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      overflow-x: auto;
      white-space: pre;
      margin-bottom: 14px;
    }

    .modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="aura"><div class="aura-orb"></div></div>
  <div class="grid-bg"></div>

  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">T</div>
        <span class="brand-title">Shared Board</span>
        <span class="live-pill" id="live-pill" aria-live="polite">
          <span class="pulse-dot"></span>
          <span id="live-text">Connecting...</span>
        </span>
      </div>

      <div class="controls">
        <div class="segmented" role="tablist" aria-label="View mode">
          <button type="button" class="seg-btn active" data-view="kanban" role="tab">Kanban</button>
          <button type="button" class="seg-btn" data-view="list" role="tab">List</button>
        </div>
        <button type="button" class="ghost-btn" id="mcp-btn">MCP</button>
        <button type="button" class="ghost-btn" id="theme-btn" aria-label="Toggle theme">Light</button>
      </div>
    </header>

    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <span id="progress-label">0 / 0 done</span>
    </div>

    <div class="error-banner" id="error-banner" role="alert"></div>

    <form class="composer" id="todo-form">
      <input
        type="text"
        id="todo-input"
        placeholder="Add a shared task... (press / to focus)"
        maxlength="280"
        autocomplete="off"
        aria-label="New task"
      />
      <select id="status-select" aria-label="Column">
        <option value="todo">To Do</option>
        <option value="in_progress">In Progress</option>
        <option value="done">Done</option>
      </select>
      <select id="priority-select" aria-label="Priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <button type="submit" class="add-btn" id="add-btn">Add Task</button>
    </form>

    <!-- Kanban Board -->
    <main class="board" id="kanban-board" aria-label="Kanban board">
      <section class="column" data-status="todo">
        <div class="col-header">
          <div class="col-title-wrap">
            <span class="col-dot"></span>
            <h2 class="col-title">To Do</h2>
            <span class="col-count" id="count-todo">0</span>
          </div>
        </div>
        <div class="col-cards" id="col-todo"></div>
      </section>

      <section class="column" data-status="in_progress">
        <div class="col-header">
          <div class="col-title-wrap">
            <span class="col-dot"></span>
            <h2 class="col-title">In Progress</h2>
            <span class="col-count" id="count-in_progress">0</span>
          </div>
        </div>
        <div class="col-cards" id="col-in_progress"></div>
      </section>

      <section class="column" data-status="done">
        <div class="col-header">
          <div class="col-title-wrap">
            <span class="col-dot"></span>
            <h2 class="col-title">Done</h2>
            <span class="col-count" id="count-done">0</span>
          </div>
          <button type="button" class="col-action" id="clear-done-kanban">Clear done</button>
        </div>
        <div class="col-cards" id="col-done"></div>
      </section>
    </main>

    <!-- List View -->
    <section class="list-shell" id="list-view" aria-label="Task list">
      <div class="list-toolbar">
        <div class="filter-row" role="group" aria-label="Filter tasks">
          <button type="button" class="filter-btn active" data-filter="all">All</button>
          <button type="button" class="filter-btn" data-filter="todo">To Do</button>
          <button type="button" class="filter-btn" data-filter="in_progress">In Progress</button>
          <button type="button" class="filter-btn" data-filter="done">Done</button>
        </div>
        <button type="button" class="col-action" id="clear-done-list">Clear done</button>
      </div>
      <ul class="list-items" id="list-items"></ul>
    </section>
  </div>

  <!-- MCP Modal -->
  <div class="modal-backdrop" id="mcp-modal" role="dialog" aria-modal="true" aria-labelledby="mcp-title">
    <div class="modal">
      <div class="modal-head">
        <h2 id="mcp-title">Connect via MCP</h2>
        <button type="button" class="icon-btn" id="mcp-close">&times;</button>
      </div>
      <p>Connect any Streamable HTTP MCP client to read, add, move, or clear cards on this shared board live:</p>
      <div class="code-box" id="mcp-snippet"></div>
      <div class="modal-foot">
        <button type="button" class="ghost-btn" id="mcp-copy">Copy JSON</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_API_BASE = "https://todo-ultra-max-api.mantikafasi.workers.dev";
    const apiParam = new URLSearchParams(location.search).get("api");
    const API_BASE = (apiParam || DEFAULT_API_BASE).replace(/\/+$/, "");
    const FALLBACK_POLL_MS = 10000;
    const STATUS_ORDER = ["todo", "in_progress", "done"];
    const STATUS_LABELS = { todo: "To Do", in_progress: "In Progress", done: "Done" };

    let todos = [];
    let viewMode = localStorage.getItem("board.view") || "kanban";
    let listFilter = "all";
    let loading = true;
    let onlineCount = 1;
    let pendingMutations = 0;
    let draggedId = null;
    let ws = null;
    let wsConnected = false;
    let wsRetries = 0;
    let pollTimer = null;

    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const statusSelect = document.getElementById("status-select");
    const prioritySelect = document.getElementById("priority-select");
    const addBtn = document.getElementById("add-btn");
    const kanbanBoard = document.getElementById("kanban-board");
    const listView = document.getElementById("list-view");
    const listItemsEl = document.getElementById("list-items");
    const livePill = document.getElementById("live-pill");
    const liveText = document.getElementById("live-text");
    const errorBanner = document.getElementById("error-banner");
    const progressFill = document.getElementById("progress-fill");
    const progressLabel = document.getElementById("progress-label");
    const themeBtn = document.getElementById("theme-btn");
    const mcpBtn = document.getElementById("mcp-btn");
    const mcpModal = document.getElementById("mcp-modal");
    const mcpClose = document.getElementById("mcp-close");
    const mcpCopy = document.getElementById("mcp-copy");
    const mcpSnippet = document.getElementById("mcp-snippet");

    // Theme setup
    const savedTheme = localStorage.getItem("board.theme") || "dark";
    applyTheme(savedTheme);

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("board.theme", theme);
      themeBtn.textContent = theme === "dark" ? "Light" : "Dark";
    }

    themeBtn.addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme");
      applyTheme(cur === "dark" ? "light" : "dark");
    });

    // MCP modal
    const mcpConfigText = JSON.stringify(
      { mcpServers: { "shared-board": { url: `${API_BASE}/mcp` } } },
      null,
      2
    );
    mcpSnippet.textContent = mcpConfigText;

    mcpBtn.addEventListener("click", () => mcpModal.classList.add("open"));
    mcpClose.addEventListener("click", () => mcpModal.classList.remove("open"));
    mcpModal.addEventListener("click", (e) => {
      if (e.target === mcpModal) mcpModal.classList.remove("open");
    });
    mcpCopy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(mcpConfigText);
        mcpCopy.textContent = "Copied!";
        setTimeout(() => (mcpCopy.textContent = "Copy JSON"), 1600);
      } catch {}
    });

    // View mode switching
    function setViewMode(mode) {
      viewMode = mode === "list" ? "list" : "kanban";
      localStorage.setItem("board.view", viewMode);
      document.querySelectorAll(".seg-btn").forEach((b) =>
        b.classList.toggle("active", b.dataset.view === viewMode)
      );
      kanbanBoard.classList.toggle("hidden", viewMode !== "kanban");
      listView.classList.toggle("active", viewMode === "list");
    }

    document.querySelectorAll(".seg-btn").forEach((b) =>
      b.addEventListener("click", () => setViewMode(b.dataset.view))
    );
    setViewMode(viewMode);

    function normalizeTodo(t) {
      const status = STATUS_ORDER.includes(t.status) ? t.status : t.done ? "done" : "todo";
      const priority = ["low", "medium", "high"].includes(t.priority) ? t.priority : "medium";
      return { ...t, status, priority, done: status === "done" };
    }

    function relativeTime(ts) {
      if (!ts) return "";
      const sec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
      if (sec < 45) return "just now";
      const min = Math.floor(sec / 60);
      if (min < 60) return `${min}m ago`;
      const hr = Math.floor(min / 60);
      if (hr < 24) return `${hr}h ago`;
      return `${Math.floor(hr / 24)}d ago`;
    }

    function setLiveStatus(state, text) {
      livePill.className = `live-pill ${state}`;
      liveText.textContent = text;
    }

    function showError(msg) {
      if (!msg) {
        errorBanner.textContent = "";
        errorBanner.classList.remove("visible");
        return;
      }
      errorBanner.textContent = msg;
      errorBanner.classList.add("visible");
    }

    async function api(path, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (options.body && !headers["Content-Type"]) {
        headers["Content-Type"] = "application/json";
      }
      const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      return data;
    }

    function renderCard(todo) {
      const card = document.createElement("article");
      card.className = "card";
      card.draggable = true;
      card.dataset.id = todo.id;

      card.addEventListener("dragstart", (e) => {
        draggedId = todo.id;
        card.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", todo.id);
      });

      card.addEventListener("dragend", () => {
        draggedId = null;
        card.classList.remove("dragging");
        document.querySelectorAll(".column").forEach((c) => c.classList.remove("drag-over"));
      });

      const top = document.createElement("div");
      top.className = "card-top";

      const prio = document.createElement("span");
      prio.className = `prio-pill prio-${todo.priority}`;
      prio.textContent = todo.priority;

      const del = document.createElement("button");
      del.type = "button";
      del.className = "icon-btn del";
      del.textContent = "\u00d7";
      del.title = "Delete";
      del.addEventListener("click", () => deleteTodo(todo.id));

      top.append(prio, del);

      const textEl = document.createElement("div");
      textEl.className = "card-text";
      textEl.textContent = todo.text;
      textEl.title = "Double-click to edit";
      textEl.addEventListener("dblclick", () => startInlineEdit(card, textEl, todo));

      const footer = document.createElement("div");
      footer.className = "card-footer";

      const timeEl = document.createElement("span");
      timeEl.textContent = relativeTime(todo.createdAt);

      const actions = document.createElement("div");
      actions.className = "card-actions";
      const idx = STATUS_ORDER.indexOf(todo.status);

      if (idx > 0) {
        const prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.className = "icon-btn";
        prevBtn.textContent = "\u2190";
        prevBtn.title = `Move to ${STATUS_LABELS[STATUS_ORDER[idx - 1]]}`;
        prevBtn.addEventListener("click", () => updateTodo(todo.id, { status: STATUS_ORDER[idx - 1] }));
        actions.appendChild(prevBtn);
      }
      if (idx < STATUS_ORDER.length - 1) {
        const nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.className = "icon-btn";
        nextBtn.textContent = "\u2192";
        nextBtn.title = `Move to ${STATUS_LABELS[STATUS_ORDER[idx + 1]]}`;
        nextBtn.addEventListener("click", () => updateTodo(todo.id, { status: STATUS_ORDER[idx + 1] }));
        actions.appendChild(nextBtn);
      }

      footer.append(timeEl, actions);
      card.append(top, textEl, footer);
      return card;
    }

    function startInlineEdit(card, textEl, todo) {
      const edit = document.createElement("input");
      edit.type = "text";
      edit.className = "card-edit-input";
      edit.value = todo.text;
      edit.maxLength = 280;
      card.replaceChild(edit, textEl);
      edit.focus();
      edit.select();

      let finished = false;
      const commit = async (save) => {
        if (finished) return;
        finished = true;
        const next = edit.value.trim();
        if (save && next && next !== todo.text) {
          await updateTodo(todo.id, { text: next });
        } else {
          render();
        }
      };

      edit.addEventListener("keydown", (e) => {
        if (e.key === "Enter") commit(true);
        if (e.key === "Escape") commit(false);
      });
      edit.addEventListener("blur", () => commit(true));
    }

    function render() {
      const total = todos.length;
      const doneCount = todos.filter((t) => t.status === "done").length;
      const pct = total === 0 ? 0 : Math.round((doneCount / total) * 100);
      progressFill.style.width = `${pct}%`;
      progressLabel.textContent = `${doneCount} / ${total} done (${pct}%)`;

      // Render Kanban columns
      for (const status of STATUS_ORDER) {
        const colEl = document.getElementById(`col-${status}`);
        const countEl = document.getElementById(`count-${status}`);
        const items = todos.filter((t) => t.status === status);
        countEl.textContent = String(items.length);
        colEl.innerHTML = "";

        if (loading) {
          const el = document.createElement("div");
          el.className = "empty-col";
          el.textContent = "Syncing...";
          colEl.appendChild(el);
          continue;
        }

        if (items.length === 0) {
          const el = document.createElement("div");
          el.className = "empty-col";
          el.textContent = "Drop a card here";
          colEl.appendChild(el);
          continue;
        }

        for (const todo of items) {
          colEl.appendChild(renderCard(todo));
        }
      }

      // Render List View
      listItemsEl.innerHTML = "";
      const visible =
        listFilter === "all" ? todos : todos.filter((t) => t.status === listFilter);

      if (loading) {
        const li = document.createElement("li");
        li.className = "empty-col";
        li.style.margin = "16px";
        li.textContent = "Loading shared tasks...";
        listItemsEl.appendChild(li);
        return;
      }

      if (visible.length === 0) {
        const li = document.createElement("li");
        li.className = "empty-col";
        li.style.margin = "16px";
        li.textContent = "No tasks in this view.";
        listItemsEl.appendChild(li);
        return;
      }

      for (const todo of visible) {
        const li = document.createElement("li");
        li.className = `list-row${todo.status === "done" ? " done" : ""}`;

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = todo.status === "done";
        cb.addEventListener("change", () =>
          updateTodo(todo.id, { status: cb.checked ? "done" : "todo" })
        );

        const prio = document.createElement("span");
        prio.className = `prio-pill prio-${todo.priority}`;
        prio.textContent = todo.priority;

        const text = document.createElement("span");
        text.className = "list-row-text";
        text.textContent = todo.text;

        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "status-chip";
        chip.textContent = STATUS_LABELS[todo.status];
        chip.title = "Click to cycle status";
        chip.addEventListener("click", () => {
          const next = STATUS_ORDER[(STATUS_ORDER.indexOf(todo.status) + 1) % STATUS_ORDER.length];
          updateTodo(todo.id, { status: next });
        });

        const del = document.createElement("button");
        del.type = "button";
        del.className = "icon-btn del";
        del.textContent = "\u00d7";
        del.addEventListener("click", () => deleteTodo(todo.id));

        li.append(cb, prio, text, chip, del);
        listItemsEl.appendChild(li);
      }
    }

    // Drag & Drop column listeners
    document.querySelectorAll(".column").forEach((col) => {
      col.addEventListener("dragover", (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        col.classList.add("drag-over");
      });
      col.addEventListener("dragleave", (e) => {
        if (!col.contains(e.relatedTarget)) col.classList.remove("drag-over");
      });
      col.addEventListener("drop", (e) => {
        e.preventDefault();
        col.classList.remove("drag-over");
        const id = e.dataTransfer.getData("text/plain") || draggedId;
        const targetStatus = col.dataset.status;
        if (id && targetStatus) {
          const item = todos.find((t) => t.id === id);
          if (item && item.status !== targetStatus) {
            updateTodo(id, { status: targetStatus });
          }
        }
      });
    });

    function startFallbackPolling() {
      if (pollTimer) return;
      pollTimer = setInterval(() => {
        if (!document.hidden && !wsConnected) fetchTodos();
      }, FALLBACK_POLL_MS);
    }

    function stopFallbackPolling() {
      if (!pollTimer) return;
      clearInterval(pollTimer);
      pollTimer = null;
    }

    function connectWebSocket() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
        return;
      }
      const wsUrl = API_BASE.replace(/^http/, "ws") + "/ws";
      try {
        ws = new WebSocket(wsUrl);
      } catch {
        startFallbackPolling();
        return;
      }

      ws.addEventListener("open", () => {
        wsConnected = true;
        wsRetries = 0;
        stopFallbackPolling();
        setLiveStatus("online", `Live \u00b7 ${onlineCount} online`);
        showError("");
      });

      ws.addEventListener("message", (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (typeof msg.online === "number") {
            onlineCount = msg.online;
            if (wsConnected) {
              setLiveStatus("online", `Live \u00b7 ${onlineCount} online`);
            }
          }
          if (msg.type === "sync" && Array.isArray(msg.todos) && pendingMutations === 0) {
            todos = msg.todos.map(normalizeTodo);
            loading = false;
            render();
          }
        } catch {}
      });

      ws.addEventListener("close", () => {
        const wasConnected = wsConnected;
        wsConnected = false;
        ws = null;
        startFallbackPolling();
        if (wasConnected && wsRetries < 8) {
          const delay = Math.min(1000 * 2 ** wsRetries, 30000);
          wsRetries++;
          setTimeout(connectWebSocket, delay);
        }
      });

      ws.addEventListener("error", () => {
        ws?.close();
      });
    }

    async function fetchTodos() {
      if (pendingMutations > 0) return;
      try {
        const data = await api("/api/todos");
        todos = Array.isArray(data.todos) ? data.todos.map(normalizeTodo) : [];
        if (typeof data.online === "number") onlineCount = data.online;
        loading = false;
        setLiveStatus("online", wsConnected ? `Live \u00b7 ${onlineCount} online` : "Connected");
        showError("");
        render();
      } catch (err) {
        loading = false;
        setLiveStatus("error", "Offline");
        showError(`Could not reach backend: ${err.message}`);
        render();
      }
    }

    async function addTodo(text, status, priority) {
      const trimmed = text.trim();
      if (!trimmed) return;
      pendingMutations++;
      addBtn.disabled = true;
      try {
        const { todo } = await api("/api/todos", {
          method: "POST",
          body: JSON.stringify({ text: trimmed, status, priority }),
        });
        const norm = normalizeTodo(todo);
        if (!todos.some((t) => t.id === norm.id)) {
          todos.unshift(norm);
        }
        showError("");
        render();
      } catch (err) {
        showError(`Failed to add task: ${err.message}`);
      } finally {
        pendingMutations--;
        addBtn.disabled = false;
      }
    }

    async function updateTodo(id, patch) {
      const prev = todos;
      todos = todos.map((t) => {
        if (t.id !== id) return t;
        const nextStatus = patch.status || (typeof patch.done === "boolean" ? (patch.done ? "done" : "todo") : t.status);
        return normalizeTodo({ ...t, ...patch, status: nextStatus });
      });
      render();
      pendingMutations++;
      try {
        await api(`/api/todos/${encodeURIComponent(id)}`, {
          method: "PATCH",
          body: JSON.stringify(patch),
        });
        showError("");
      } catch (err) {
        todos = prev;
        render();
        showError(`Failed to update task: ${err.message}`);
      } finally {
        pendingMutations--;
      }
    }

    async function deleteTodo(id) {
      const prev = todos;
      todos = todos.filter((t) => t.id !== id);
      render();
      pendingMutations++;
      try {
        await api(`/api/todos/${encodeURIComponent(id)}`, { method: "DELETE" });
        showError("");
      } catch (err) {
        todos = prev;
        render();
        showError(`Failed to delete task: ${err.message}`);
      } finally {
        pendingMutations--;
      }
    }

    async function clearCompleted() {
      const prev = todos;
      todos = todos.filter((t) => t.status !== "done");
      render();
      pendingMutations++;
      try {
        await api("/api/todos?completed=true", { method: "DELETE" });
        showError("");
      } catch (err) {
        todos = prev;
        render();
        showError(`Failed to clear done tasks: ${err.message}`);
      } finally {
        pendingMutations--;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const val = input.value;
      if (!val.trim()) return;
      input.value = "";
      await addTodo(val, statusSelect.value, prioritySelect.value);
      input.focus();
    });

    document.querySelectorAll(".filter-btn").forEach((btn) =>
      btn.addEventListener("click", () => {
        listFilter = btn.dataset.filter;
        document.querySelectorAll(".filter-btn").forEach((b) =>
          b.classList.toggle("active", b === btn)
        );
        render();
      })
    );

    document.getElementById("clear-done-kanban").addEventListener("click", clearCompleted);
    document.getElementById("clear-done-list").addEventListener("click", clearCompleted);

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
        e.preventDefault();
        input.focus();
      }
      if (e.key === "Escape") {
        mcpModal.classList.remove("open");
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && !wsConnected) fetchTodos();
    });

    render();
    fetchTodos();
    connectWebSocket();
  </script>
</body>
</html>
