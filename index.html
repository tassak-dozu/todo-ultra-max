<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --card: #171a21;
      --border: #262b36;
      --text: #e6e9ef;
      --muted: #8b94a6;
      --accent: #7c5cff;
      --accent-hover: #6a48f5;
      --danger: #ef4444;
      --ok: #22c55e;
      --done: #5c6578;
      --input-bg: #11141a;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f6fa;
        --card: #ffffff;
        --border: #e2e6ef;
        --text: #181b22;
        --muted: #647087;
        --accent: #6344f5;
        --accent-hover: #5233e6;
        --danger: #dc2626;
        --ok: #16a34a;
        --done: #9aa3b5;
        --input-bg: #f8f9fc;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
      line-height: 1.5;
    }

    .app {
      width: 100%;
      max-width: 540px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status.online .status-dot {
      background: var(--ok);
    }

    .status.error .status-dot {
      background: var(--danger);
    }

    .error-banner {
      display: none;
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: var(--danger);
      font-size: 0.85rem;
    }

    .error-banner.visible {
      display: block;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.14);
    }

    .input-row {
      display: flex;
      gap: 8px;
      padding: 14px;
      border-bottom: 1px solid var(--border);
    }

    .input-row input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    .input-row input:focus {
      border-color: var(--accent);
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--muted);
      gap: 8px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      gap: 4px;
    }

    .filter-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .filter-btn.active {
      color: var(--text);
      border-color: var(--border);
      background: var(--input-bg);
    }

    .clear-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
    }

    .clear-btn:hover {
      color: var(--danger);
    }

    ul.todo-list {
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .todo-item:last-child {
      border-bottom: none;
    }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-text {
      flex: 1;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--done);
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .delete-btn:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    .empty {
      padding: 36px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Todo</h1>
      <span class="status" id="status" aria-live="polite">
        <span class="status-dot"></span>
        <span id="status-text">Connecting...</span>
      </span>
    </header>

    <div class="error-banner" id="error-banner" role="alert"></div>

    <section class="card" aria-label="Shared todo application">
      <form class="input-row" id="todo-form">
        <input
          type="text"
          id="todo-input"
          placeholder="Add a shared task..."
          maxlength="280"
          autocomplete="off"
          aria-label="New task"
        />
        <button type="submit" class="btn btn-primary" id="add-btn">Add</button>
      </form>

      <div class="toolbar">
        <span id="count">0 items left</span>
        <div class="filters" role="group" aria-label="Filter tasks">
          <button type="button" class="filter-btn active" data-filter="all">All</button>
          <button type="button" class="filter-btn" data-filter="active">Active</button>
          <button type="button" class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <button type="button" class="clear-btn" id="clear-completed">Clear done</button>
      </div>

      <ul class="todo-list" id="todo-list"></ul>
    </section>
  </main>

  <script>
    const API_BASE = "https://todo-ultra-max-api.mantikafasi.workers.dev";
    const POLL_MS = 3000;

    let todos = [];
    let filter = "all";
    let loading = true;
    let pendingMutations = 0;

    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const addBtn = document.getElementById("add-btn");
    const list = document.getElementById("todo-list");
    const countEl = document.getElementById("count");
    const clearBtn = document.getElementById("clear-completed");
    const filterBtns = document.querySelectorAll(".filter-btn");
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("status-text");
    const errorBanner = document.getElementById("error-banner");

    function setStatus(state, text) {
      statusEl.className = `status ${state}`;
      statusText.textContent = text;
    }

    function showError(message) {
      if (!message) {
        errorBanner.textContent = "";
        errorBanner.classList.remove("visible");
        return;
      }
      errorBanner.textContent = message;
      errorBanner.classList.add("visible");
    }

    async function api(path, options = {}) {
      const res = await fetch(`${API_BASE}${path}`, {
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        ...options,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error || `Request failed (${res.status})`);
      }
      return data;
    }

    function render() {
      const visible = todos.filter((t) => {
        if (filter === "active") return !t.done;
        if (filter === "completed") return t.done;
        return true;
      });

      const activeCount = todos.filter((t) => !t.done).length;
      countEl.textContent = `${activeCount} item${activeCount === 1 ? "" : "s"} left`;

      list.innerHTML = "";

      if (loading) {
        const el = document.createElement("li");
        el.className = "empty";
        el.textContent = "Loading shared tasks...";
        list.appendChild(el);
        return;
      }

      if (visible.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent =
          filter === "all"
            ? "No tasks yet. Add one above."
            : `No ${filter} tasks.`;
        list.appendChild(empty);
        return;
      }

      for (const todo of visible) {
        const li = document.createElement("li");
        li.className = `todo-item${todo.done ? " completed" : ""}`;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.setAttribute("aria-label", `Mark "${todo.text}" as ${todo.done ? "active" : "completed"}`);
        checkbox.addEventListener("change", () => toggleTodo(todo.id, checkbox.checked));

        const span = document.createElement("span");
        span.className = "todo-text";
        span.textContent = todo.text;

        const del = document.createElement("button");
        del.type = "button";
        del.className = "delete-btn";
        del.textContent = "\u00d7";
        del.setAttribute("aria-label", `Delete "${todo.text}"`);
        del.addEventListener("click", () => deleteTodo(todo.id));

        li.append(checkbox, span, del);
        list.appendChild(li);
      }
    }

    async function fetchTodos() {
      if (pendingMutations > 0) return;
      try {
        const data = await api("/api/todos");
        todos = Array.isArray(data.todos) ? data.todos : [];
        loading = false;
        setStatus("online", "Shared · Live");
        showError("");
        render();
      } catch (err) {
        loading = false;
        setStatus("error", "Offline");
        showError(`Could not reach backend: ${err.message}`);
        render();
      }
    }

    async function addTodo(text) {
      const trimmed = text.trim();
      if (!trimmed) return;
      pendingMutations++;
      addBtn.disabled = true;
      try {
        const { todo } = await api("/api/todos", {
          method: "POST",
          body: JSON.stringify({ text: trimmed }),
        });
        todos.unshift(todo);
        setStatus("online", "Shared · Live");
        showError("");
        render();
      } catch (err) {
        showError(`Failed to add task: ${err.message}`);
      } finally {
        pendingMutations--;
        addBtn.disabled = false;
      }
    }

    async function toggleTodo(id, done) {
      const prev = todos;
      todos = todos.map((t) => (t.id === id ? { ...t, done } : t));
      render();
      pendingMutations++;
      try {
        await api(`/api/todos/${encodeURIComponent(id)}`, {
          method: "PATCH",
          body: JSON.stringify({ done }),
        });
        setStatus("online", "Shared · Live");
        showError("");
      } catch (err) {
        todos = prev;
        render();
        showError(`Failed to update task: ${err.message}`);
      } finally {
        pendingMutations--;
      }
    }

    async function deleteTodo(id) {
      const prev = todos;
      todos = todos.filter((t) => t.id !== id);
      render();
      pendingMutations++;
      try {
        await api(`/api/todos/${encodeURIComponent(id)}`, { method: "DELETE" });
        setStatus("online", "Shared · Live");
        showError("");
      } catch (err) {
        todos = prev;
        render();
        showError(`Failed to delete task: ${err.message}`);
      } finally {
        pendingMutations--;
      }
    }

    async function clearCompleted() {
      const prev = todos;
      todos = todos.filter((t) => !t.done);
      render();
      pendingMutations++;
      try {
        await api("/api/todos?completed=true", { method: "DELETE" });
        setStatus("online", "Shared · Live");
        showError("");
      } catch (err) {
        todos = prev;
        render();
        showError(`Failed to clear completed tasks: ${err.message}`);
      } finally {
        pendingMutations--;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const value = input.value;
      if (!value.trim()) return;
      input.value = "";
      await addTodo(value);
      input.focus();
    });

    filterBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        filter = btn.dataset.filter;
        filterBtns.forEach((b) => b.classList.toggle("active", b === btn));
        render();
      });
    });

    clearBtn.addEventListener("click", clearCompleted);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) fetchTodos();
    });

    setInterval(() => {
      if (!document.hidden) fetchTodos();
    }, POLL_MS);

    render();
    fetchTodos();
  </script>
</body>
</html>
